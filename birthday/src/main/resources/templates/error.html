<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грешка</title>
    <style>
        body{font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;background:#f6f8fb;color:#222;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
        .card{background:#fff;border-radius:12px;padding:28px;max-width:720px;box-shadow:0 12px 40px rgba(16,24,40,0.08)}
        h1{margin:0 0 12px;font-size:1.6rem}
        p{margin:6px 0;color:#555}
        .meta{margin-top:12px;font-size:0.9rem;color:#888}
        a.button{display:inline-block;margin-top:16px;padding:10px 14px;border-radius:10px;background:#ff5d8f;color:#fff;text-decoration:none;font-weight:700}
    </style>
    </head>
<body>
<div class="card">
    <h1>Съжаляваме — възникна грешка</h1>
    <p th:text="${message}">Възникна проблем. Опитайте отново по-късно.</p>
    <div class="meta">
        <div><strong>Статус:</strong> <span th:text="${status}">500</span></div>
        <div><strong>Път:</strong> <span th:text="${path}">/</span></div>
    </div>
    <a class="button" href="/">Към началото</a>
</div>
</body>
</html>
